[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "kaos-graph"
# Single source of truth: Cargo.toml [package].version. Maturin reads
# Cargo SemVer (e.g. "0.1.0-alpha.1") and emits PEP 440-normalized
# wheel metadata (e.g. "0.1.0a1"). Avoids the dual-source drift
# tracked in docs/oss/30-rust-packaging/version-coupling.md (Option C).
dynamic = ["version"]
description = "High-performance graph library for the Kelvin Agentic OS — petgraph-backed engine, 40+ algorithms, RDF/SPARQL, knowledge-graph tools"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "273 Ventures LLC", email = "it@273ventures.com" },
]
keywords = [
  "graph",
  "petgraph",
  "rdf",
  "sparql",
  "knowledge-graph",
  "agentic",
  "mcp",
  "kaos",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  # defusedxml hardens GraphML/GEXF parsing against XML attacks (audit A2-#6).
  # Tiny pure-Python wrapper around stdlib xml.etree, MIT-licensed.
  "defusedxml>=0.7.1",
]

[project.scripts]
kaos-graph = "kaos_graph.cli:main"
kaos-graph-serve = "kaos_graph.serve:main"

# Only `[rdf]` ships at v0.1.0a1. The `[mcp]`, `[tabular]`, and `[programs]`
# extras land in a follow-up release once kaos-mcp / kaos-content /
# kaos-llm-core are on PyPI (Wave 3 of docs/oss/00-overview/decisions.md
# D013-rev). Until then, declaring them would break `uv lock` because the
# resolver requires every extra to resolve at lock time.
[project.optional-dependencies]
rdf = ["pyoxigraph>=0.5"]

[project.urls]
Homepage = "https://kelvin.legal"
Documentation = "https://docs.kelvin.legal"
Repository = "https://github.com/273v/kaos-graph"
Issues = "https://github.com/273v/kaos-graph/issues"
Changelog = "https://github.com/273v/kaos-graph/blob/main/CHANGELOG.md"

[dependency-groups]
# Per audit A2-#9: bump pytest, cryptography (transitive), python-multipart
# (transitive) to known-safe versions. cryptography pin matches kaos-core's
# CVE-driven floor (CVE-2026-34073, CVE-2026-39892).
dev = [
  "kaos-core>=0.1.0a1",
  "cryptography>=46.0.7",
  "maturin>=1.8,<2.0",  # needed for `uv run maturin develop` in CI
  "networkx>=3.5",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "python-multipart>=0.0.25",
  "ruff>=0.15.12",
  "ty>=0.0.34,<0.1",
]

[tool.maturin]
python-source = "python"
module-name = "kaos_graph._rust"
# abi3-py313: build the stable-ABI wheel so one binary per OS/arch covers
# every CPython 3.13+ minor. Wheel filename gets `cp313-abi3` instead of
# `cp313-cp313`. Mirror in Cargo.toml's `pyo3` feature list.
features = ["pyo3/extension-module", "pyo3/abi3-py313"]
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "NOTICE", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "SECURITY.md", format = "sdist" },
]
# Exclude runtime artifacts from sdist (audit A2-#10). These are local-only
# scratch directories that must not be redistributed.
exclude = [
  { path = ".kaos-vfs/**", format = "sdist" },
  { path = "target/**", format = "sdist" },
  { path = ".pytest_cache/**", format = "sdist" },
  { path = ".ruff_cache/**", format = "sdist" },
  { path = ".venv/**", format = "sdist" },
  { path = "htmlcov/**", format = "sdist" },
  { path = ".kaos-vfs/**", format = "wheel" },
  { path = "target/**", format = "wheel" },
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "integration: end-to-end behavior checks",
  "unit: focused unit checks",
  "slow: tests that take >1s to run",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["kaos_graph"]

[tool.ty.src]
include = ["python/kaos_graph", "tests"]
# tests/unit/test_programs.py exercises the kaos-llm-core integration path
# and python/kaos_graph/tools/_programs.py registers the kaos-graph-trace-to-graph
# MCP tool that lazy-imports kaos-llm-core. Until kaos-llm-core publishes
# (Wave 3), those imports are unresolvable from ty's static view but skip
# cleanly at runtime via ImportError fallbacks. Re-include both files in
# the patch release that brings the sibling back.
exclude = [
  "tests/unit/test_programs.py",
  "python/kaos_graph/tools/_programs.py",
]

[tool.uv]
package = true
exclude-newer = "72 hours"
[tool.uv.exclude-newer-package]
"kaos-citations" = false
"kaos-content" = false
"kaos-core" = false
"kaos-graph" = false
"kaos-llm-client" = false
"kaos-llm-core" = false
"kaos-mcp" = false
"kaos-ml-core" = false
"kaos-names" = false
"kaos-nlp-core" = false
"kaos-nlp-transformers" = false
"kaos-office" = false
"kaos-pdf" = false
"kaos-source" = false
"kaos-tabular" = false
"kaos-web" = false
